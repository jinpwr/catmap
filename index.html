<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardflow — Infinite Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toolbar -->
  <aside id="toolbar">
    

    <div class="tool-group">
      <button class="tool-btn" id="btn-select" title="Select (V)" data-mode="select">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 2L15 9L9 10.5L6.5 16L3 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-card" title="Add Card (C)" data-mode="card">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="7" x2="16" y2="7" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-text" title="Add Text (T)" data-mode="text">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 4H15M9 4V14M6 14H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-line" title="Connect (L)" data-mode="line">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="5.4" y1="5.4" x2="12.6" y2="12.6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tool-group">
      <button class="tool-btn danger" id="btn-delete" title="Delete selected (Del)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 5H15M7 5V3H11V5M6 5L6.5 14H11.5L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-clear" title="Clear all">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 14L7 4H11L16 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 10H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Light/Dark Mode Toggle -->
      <button class="tool-btn" id="btn-theme" title="Toggle light/dark mode">
        <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="4" stroke="currentColor" stroke-width="1.5"/>
          <line x1="9" y1="1" x2="9" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="15" x2="9" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="9" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3.22" y1="3.22" x2="4.64" y2="4.64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.36" y1="13.36" x2="14.78" y2="14.78" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3.22" y1="14.78" x2="4.64" y2="13.36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.36" y1="4.64" x2="14.78" y2="3.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none">
          <path d="M15 9.5A6 6 0 1 1 8.5 3a4.5 4.5 0 0 0 6.5 6.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-spacer"></div>

    <div class="tool-group color-group">
      <div class="color-swatch-row" id="color-swatches">
        <button class="swatch" data-color="#4F7FFF" style="background:#4F7FFF" title="Blue"></button>
        <button class="swatch" data-color="#FF6B6B" style="background:#FF6B6B" title="Coral"></button>
        <button class="swatch" data-color="#FFD166" style="background:#FFD166" title="Amber"></button>
        <button class="swatch" data-color="#06D6A0" style="background:#06D6A0" title="Mint"></button>
        <button class="swatch" data-color="#BF5AF2" style="background:#BF5AF2" title="Purple"></button>
        <button class="swatch" data-color="#FF9F0A" style="background:#FF9F0A" title="Orange"></button>
      </div>
      <label class="custom-color-label" title="Custom color">
        <input type="color" id="color-picker" value="#4F7FFF" />
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9 3C9 3 13 6 13 9C13 12 9 15 9 15" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
          <circle cx="9" cy="9" r="2" fill="currentColor" opacity="0.4"/>
        </svg>
      </label>
    </div>
  </aside>

  <!-- Export PDF Button -->
  <button id="export-pdf-btn" title="Export board as PDF">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <rect x="1" y="1" width="9" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
      <path d="M4 5h5M4 7.5h5M4 10h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M10 8l3 0M11.5 6.5V9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    Export PDF
  </button>

  <!-- Status Bar -->
  <div id="status-bar">
    <span id="status-mode">● Select</span>
    <span id="status-zoom">100%</span>
    <span id="status-hint">Shift+click to multi-select · Right-click to connect</span>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="hidden">
    <button class="ctx-item" id="ctx-connect">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="3" cy="3" r="1.5" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="11" cy="11" r="1.5" stroke="currentColor" stroke-width="1.2"/>
        <line x1="4.1" y1="4.1" x2="9.9" y2="9.9" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>
      </svg>
      Connect Selected
    </button>
    <button class="ctx-item ctx-danger" id="ctx-delete">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 4H12M5 4V2.5H9V4M4.5 4L5 11H9L9.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Delete
    </button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" id="ctx-cancel">Cancel</button>
  </div>

  <!-- Connection Mode Overlay -->
  <div id="connection-overlay" class="hidden">
    <div class="connection-banner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="3" cy="3" r="2" fill="currentColor" opacity="0.7"/>
        <circle cx="13" cy="13" r="2" fill="currentColor" opacity="0.7"/>
        <line x1="4.4" y1="4.4" x2="11.6" y2="11.6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
      </svg>
      Connection Mode — click first element
      <button id="cancel-connect-mode">✕ Cancel</button>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-container">
    <div id="canvas"></div>
  </div>

  <!-- CDN Libraries -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line-new@1.1.9/leader-line.min.js"></script>
  <!-- html2canvas + jsPDF for PDF export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
