<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardflow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ HOME DASHBOARD OVERLAY ══ -->
  <div id="dashboard" class="hidden">
    <div class="dash-header">
      <div class="dash-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.9"/>
          <rect x="13" y="2" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.45"/>
          <rect x="2" y="13" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.45"/>
          <rect x="13" y="13" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.18"/>
        </svg>
        Boardflow
      </div>
      <div class="dash-actions">
        <button id="dash-theme-toggle" class="dash-icon-btn" title="Toggle theme">
          <svg id="dash-theme-icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.41 1.41M13.37 13.37l1.41 1.41M3.22 14.78l1.41-1.41M13.37 4.63l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg id="dash-theme-icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none">
            <path d="M15 10.5A6.5 6.5 0 0 1 7.5 3a6.5 6.5 0 1 0 7.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="dash-close" class="dash-icon-btn" title="Close">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="dash-title-row">
      <h1 class="dash-title">Your Boards</h1>
      <span class="dash-subtitle">All workspaces, sorted by last modified</span>
    </div>
    <div id="dash-board-grid">
      <!-- Board cards injected here -->
    </div>
  </div>

  <!-- ══ MAIN APP SHELL ══ -->
  <div id="app-shell">

    <!-- Top-left home + board name bar -->
    <div id="topbar">
      <button id="btn-home" class="topbar-btn" title="Home">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.9"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.18"/>
        </svg>
        Boardflow
      </button>
      <span class="topbar-sep">/</span>
      <span id="board-name" class="board-name" contenteditable="true" spellcheck="false">Untitled Board</span>
    </div>

    <!-- ══ TOOLBAR ══ -->
    <aside id="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" id="btn-select" data-mode="select" title="Select (V)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 1.5L14 8L8.5 9.5L6.5 14.5L2.5 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          </svg>
          <span class="tool-label">Select</span>
        </button>
        <button class="tool-btn" id="btn-card" data-mode="card" title="Card (C)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="tool-label">Card</span>
        </button>
        <button class="tool-btn" id="btn-text" data-mode="text" title="Text (T)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 3.5h11M8 3.5v9M5.5 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="tool-label">Text</span>
        </button>
        <button class="tool-btn" id="btn-line" data-mode="line" title="Connect (L)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="3.5" cy="3.5" r="2" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="12.5" cy="12.5" r="2" stroke="currentColor" stroke-width="1.4"/>
            <line x1="5.1" y1="5.1" x2="10.9" y2="10.9" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.5"/>
          </svg>
          <span class="tool-label">Connect</span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="tool-group">
        <!-- Line style picker -->
        <div class="tool-dropdown-wrap" id="line-style-wrap">
          <button class="tool-btn" id="btn-line-style" title="Line style">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" id="line-style-icon">
              <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/>
              <path d="M11 5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span class="tool-label">Style</span>
          </button>
          <div class="tool-dropdown" id="line-style-menu">
            <button class="dropdown-item active" data-style="arrow">
              <svg width="40" height="14" viewBox="0 0 40 14" fill="none">
                <line x1="2" y1="7" x2="32" y2="7" stroke="currentColor" stroke-width="1.5"/>
                <path d="M29 4l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
              Arrow
            </button>
            <button class="dropdown-item" data-style="dot">
              <svg width="40" height="14" viewBox="0 0 40 14" fill="none">
                <line x1="6" y1="7" x2="34" y2="7" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="4" cy="7" r="2.5" fill="currentColor"/>
                <circle cx="36" cy="7" r="2.5" fill="currentColor"/>
              </svg>
              Dot-to-Dot
            </button>
          </div>
        </div>

        <button class="tool-btn danger" id="btn-delete" title="Delete (Del)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 4.5h11M6 4.5V3h4v1.5M5 4.5l.5 8h5l.5-8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="tool-label">Delete</span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="tool-group">
        <!-- Color swatches -->
        <div class="swatch-grid">
          <button class="swatch" data-color="#3B82F6" style="background:#3B82F6"></button>
          <button class="swatch" data-color="#EF4444" style="background:#EF4444"></button>
          <button class="swatch" data-color="#F59E0B" style="background:#F59E0B"></button>
          <button class="swatch" data-color="#10B981" style="background:#10B981"></button>
          <button class="swatch" data-color="#8B5CF6" style="background:#8B5CF6"></button>
          <button class="swatch" data-color="#EC4899" style="background:#EC4899"></button>
        </div>
        <label class="tool-btn color-btn" title="Custom color">
          <input type="color" id="color-picker" value="#3B82F6"/>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 2.5a5.5 5.5 0 0 1 0 11" stroke="currentColor" stroke-width="1" opacity="0.35"/>
            <circle cx="8" cy="8" r="1.5" fill="currentColor" opacity="0.5"/>
          </svg>
          <span class="tool-label">Color</span>
        </label>
      </div>

      <div class="toolbar-sep"></div>

      <div class="tool-group">
        <!-- Export dropdown -->
        <div class="tool-dropdown-wrap" id="export-wrap">
          <button class="tool-btn" id="btn-export" title="Export">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2.5 11v2a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="tool-label">Export</span>
          </button>
          <div class="tool-dropdown" id="export-menu">
            <button class="dropdown-item" id="export-json">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="1.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.2"/>
                <path d="M4 5h1.5v4H4M8.5 5H10v1.5a1 1 0 0 1-1 1H8.5v1.5H10" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
              </svg>
              Export JSON
            </button>
            <button class="dropdown-item" id="export-svg">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="1.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.2"/>
                <path d="M3.5 8.5C4 10 6 10.5 7 9.5s-.5-3 1-3.5 3 1 3 2.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" fill="none"/>
              </svg>
              Export SVG
            </button>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item" id="import-json-btn">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 10V2M4 5l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 11.5h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              Import JSON
            </button>
          </div>
        </div>

        <!-- Theme toggle -->
        <button class="tool-btn" id="btn-theme" title="Toggle theme (D)">
          <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M2.93 2.93l1.06 1.06M12.01 12.01l1.06 1.06M2.93 13.07l1.06-1.06M12.01 3.99l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none">
            <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span class="tool-label">Theme</span>
        </button>
      </div>
    </aside>

    <!-- ══ STATUS BAR ══ -->
    <div id="status-bar">
      <span id="status-mode">● Select</span>
      <span id="status-zoom">100%</span>
      <span id="status-hint">Shift+click to multi-select · Right-click to connect</span>
    </div>

    <!-- ══ CONTEXT MENU ══ -->
    <div id="context-menu" class="hidden">
      <button class="ctx-item" id="ctx-connect">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <circle cx="2.5" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1.1"/>
          <circle cx="10.5" cy="10.5" r="1.5" stroke="currentColor" stroke-width="1.1"/>
          <line x1="3.6" y1="3.6" x2="9.4" y2="9.4" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.5 1.2"/>
        </svg>
        Connect Selected
      </button>
      <button class="ctx-item ctx-danger" id="ctx-delete">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 3.5h9M5 3.5V2.5H8V3.5M4 3.5l.4 7H8.6l.4-7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        Delete
      </button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" id="ctx-cancel">Cancel</button>
    </div>

    <!-- ══ CONNECTION MODE BANNER ══ -->
    <div id="connection-overlay" class="hidden">
      <div class="connection-banner" id="connection-banner">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="2.5" cy="2.5" r="2" fill="currentColor" opacity="0.7"/>
          <circle cx="11.5" cy="11.5" r="2" fill="currentColor" opacity="0.7"/>
          <line x1="4" y1="4" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.5"/>
        </svg>
        <span id="connection-banner-text">Connection mode — hover an element to see anchors</span>
        <button id="cancel-connect-mode">✕ Exit</button>
      </div>
    </div>

    <!-- ══ CANVAS ══ -->
    <div id="canvas-container">
      <!-- SVG overlay for live drag-to-connect preview line -->
      <svg id="preview-svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:600;">
        <line id="preview-line" x1="0" y1="0" x2="0" y2="0" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" opacity="0" stroke-linecap="round"/>
      </svg>
      <div id="canvas"></div>
    </div>

  </div><!-- /app-shell -->

  <!-- Hidden file input for import -->
  <input type="file" id="import-file-input" accept=".json" style="display:none"/>

  <!-- Icon picker popup (teleported, shared) -->
  <div id="icon-picker-popup" class="hidden">
    <div class="icon-picker-grid" id="icon-picker-grid"></div>
  </div>

  <!-- CDN Libraries -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line-new@1.1.9/leader-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-force@3.0.0/dist/d3-force.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
