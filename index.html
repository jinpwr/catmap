<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardflow — Infinite Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ APP SHELL ══ -->
  <div id="app-shell">

    <!-- Top bar -->
    <div id="topbar">
      <button id="btn-home" class="topbar-btn" title="Home">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.9"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.18"/>
        </svg>
        Boardflow
      </button>
      <span class="topbar-sep">/</span>
      <span id="board-name" class="board-name" contenteditable="true" spellcheck="false">Untitled Board</span>

      <!-- Top-right actions -->
      <div class="topbar-right">
        <button class="tool-btn topbar-action-btn" id="btn-theme" title="Toggle theme">
          <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M2.93 2.93l1.06 1.06M12.01 12.01l1.06 1.06M2.93 13.07l1.06-1.06M12.01 3.99l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" style="display:none">
            <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="topbar-action-btn export-pdf-btn" id="btn-export-pdf" title="Export as PDF">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="1" width="10" height="13" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5 5h5M5 8h5M5 11h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <rect x="9" y="9" width="5" height="5" rx="1" fill="var(--danger)" opacity="0.85"/>
            <path d="M10.5 13v-3M10.5 13l-1-1.2M10.5 13l1-1.2" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Export PDF
        </button>
      </div>
    </div>

    <!-- ══ TOOLBAR ══ -->
    <aside id="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" id="btn-select" data-mode="select" title="Select (V)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 1.5L14 8L8.5 9.5L6.5 14.5L2.5 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="tool-label">Select</span>
        </button>
        <button class="tool-btn" id="btn-card" data-mode="card" title="Card (C)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="1.5" y1="6.5" x2="14.5" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="tool-label">Card</span>
        </button>
        <button class="tool-btn" id="btn-text" data-mode="text" title="Text (T)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 3.5h11M8 3.5v9M5.5 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="tool-label">Text</span>
        </button>
        <!-- Line tool: creates free-floating lines that can snap to elements -->
        <button class="tool-btn" id="btn-line" data-mode="line" title="Line (L)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line x1="2" y1="14" x2="14" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="2" cy="14" r="2" fill="currentColor" opacity="0.7"/>
            <circle cx="14" cy="2" r="2" fill="currentColor" opacity="0.7"/>
          </svg>
          <span class="tool-label">Line</span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="tool-group">
        <button class="tool-btn danger" id="btn-delete" title="Delete (Del)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 4.5h11M6 4.5V3h4v1.5M5 4.5l.5 8h5l.5-8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="tool-label">Delete</span>
        </button>
      </div>

      <div class="toolbar-sep"></div>

      <div class="tool-group">
        <div class="swatch-grid">
          <button class="swatch" data-color="#3B82F6" style="background:#3B82F6"></button>
          <button class="swatch" data-color="#EF4444" style="background:#EF4444"></button>
          <button class="swatch" data-color="#F59E0B" style="background:#F59E0B"></button>
          <button class="swatch" data-color="#10B981" style="background:#10B981"></button>
          <button class="swatch" data-color="#8B5CF6" style="background:#8B5CF6"></button>
          <button class="swatch" data-color="#EC4899" style="background:#EC4899"></button>
        </div>
        <label class="tool-btn color-btn" title="Custom color">
          <input type="color" id="color-picker" value="#3B82F6"/>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 2.5a5.5 5.5 0 0 1 0 11" stroke="currentColor" stroke-width="1" opacity="0.35"/>
            <circle cx="8" cy="8" r="1.5" fill="currentColor" opacity="0.5"/>
          </svg>
          <span class="tool-label">Color</span>
        </label>
      </div>
    </aside>

    <!-- ══ STATUS BAR ══ -->
    <div id="status-bar">
      <span id="status-mode">● Select</span>
      <span id="status-zoom">100%</span>
      <span id="status-hint">Click to select · Drag anywhere to move · L for line tool</span>
    </div>

    <!-- ══ CONTEXT MENU ══ -->
    <div id="context-menu" class="hidden">
      <button class="ctx-item ctx-danger" id="ctx-delete">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 3.5h9M5 3.5V2.5H8V3.5M4 3.5l.4 7H8.6l.4-7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        Delete
      </button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" id="ctx-cancel">Cancel</button>
    </div>

    <!-- ══ LINE MODE BANNER ══ -->
    <div id="line-overlay" class="hidden">
      <div class="connection-banner" id="line-banner">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <line x1="1" y1="13" x2="13" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="1" cy="13" r="2" fill="currentColor" opacity="0.8"/>
          <circle cx="13" cy="1" r="2" fill="currentColor" opacity="0.8"/>
        </svg>
        <span id="line-banner-text">Line mode — click on canvas or an element to set start point</span>
        <button id="cancel-line-mode">✕ Exit</button>
      </div>
    </div>

    <!-- ══ CANVAS ══ -->
    <div id="canvas-container">
      <!-- SVG overlay for live line drawing preview -->
      <svg id="preview-svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:600;">
        <defs>
          <marker id="preview-arrow" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#3B82F6" opacity="0.7"/>
          </marker>
        </defs>
        <line id="preview-line" x1="0" y1="0" x2="0" y2="0"
          stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4"
          opacity="0" stroke-linecap="round"
          marker-end="url(#preview-arrow)"/>
      </svg>
      <div id="canvas"></div>
    </div>

  </div><!-- /app-shell -->

  <!-- ══ HOME DASHBOARD ══ -->
  <div id="dashboard" class="hidden">
    <div class="dash-header">
      <div class="dash-logo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="1" y="1" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.9"/>
          <rect x="12" y="1" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.4"/>
          <rect x="1" y="12" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.4"/>
          <rect x="12" y="12" width="9" height="9" rx="2.5" fill="currentColor" opacity="0.18"/>
        </svg>
        Boardflow
      </div>
      <div class="dash-actions">
        <button id="dash-theme-toggle" class="dash-icon-btn" title="Toggle theme">
          <svg id="dash-theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M2.93 2.93l1.06 1.06M12.01 12.01l1.06 1.06M2.93 13.07l1.06-1.06M12.01 3.99l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <svg id="dash-theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none">
            <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="dash-close" class="dash-icon-btn" title="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="dash-title-row">
      <h1 class="dash-title">Your Boards</h1>
    </div>
    <div id="dash-board-grid"></div>
  </div>

  <!-- CDN Libraries -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line-new@1.1.9/leader-line.min.js"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
